server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;
  gzip on; gzip_vary on; gzip_comp_level 6;
  gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  location / { try_files $uri $uri/ $uri.html =404; }
  location ~* \.(css|js|svg|webp|avif|png|jpg|woff2)$ { expires 30d; add_header Cache-Control "public, immutable"; }
  error_page 404 /404.html;
}
